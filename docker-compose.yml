services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: minwon
      POSTGRES_USER: minwon
      POSTGRES_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD를 설정하세요}
    volumes:
      - db-data:/var/lib/postgresql/data
      - ./backend/src/schema.sql:/docker-entrypoint-initdb.d/schema.sql:ro
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U minwon -d minwon']
      interval: 5s
      retries: 10

  app:
    build: .
    environment:
      # 이 두 값은 반드시 바꿔서 넣어야 한다. 기본값으로 뜨면 로그에 경고가 남는다.
      APP_SECRET: ${APP_SECRET:?APP_SECRET을 설정하세요}
      ADMIN_TOKEN: ${ADMIN_TOKEN:?ADMIN_TOKEN을 설정하세요}
      DATABASE_URL: postgres://minwon:${DB_PASSWORD}@db:5432/minwon
      PORT: 8787
    ports:
      - '8787:8787'
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

volumes:
  db-data:
